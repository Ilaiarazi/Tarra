<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarra — Sign up</title>
    <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --teal: #00d4aa;
            --bg: #080c10;
            --surface: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.09);
            --text: #e8eaf6;
            --muted: rgba(232,234,246,0.55);
        }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 2rem;
            overflow: hidden;
        }
        .glow-orb {
            position: fixed; width: 620px; height: 620px; border-radius: 50%;
            background: radial-gradient(circle, rgba(0,212,170,0.10) 0%, transparent 70%);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 0; pointer-events: none;
        }
        .auth-card {
            position: relative; z-index: 1;
            width: 100%; max-width: 400px;
            background: var(--surface);
            border: 1px solid rgba(0,212,170,0.14);
            border-radius: 22px;
            padding: 2.6rem 2.2rem;
        }
        .auth-logo {
            display: block; text-align: center;
            font-family: 'Metal Mania', cursive; font-size: 2.6rem;
            background: linear-gradient(180deg, #ffffff 0%, var(--teal) 50%, #007a66 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; text-decoration: none; letter-spacing: 0.05em;
            filter: drop-shadow(0 0 8px rgba(0,212,170,0.5));
            margin-bottom: 0.4rem;
        }
        .auth-sub { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }
        .field { display: flex; flex-direction: column; gap: 0.45rem; margin-bottom: 1.1rem; }
        .field label {
            font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em;
            text-transform: uppercase; color: var(--muted);
        }
        .field input {
            background: rgba(255,255,255,0.06); border: 1px solid var(--border);
            color: var(--text); border-radius: 10px; padding: 0.75rem 1rem;
            font-size: 0.95rem; outline: none; transition: border-color 0.2s;
            font-family: inherit;
        }
        .field input:focus { border-color: var(--teal); }
        .field-hint { font-size: 0.72rem; color: var(--muted); }
        .btn-submit {
            width: 100%; background: var(--teal); color: #080c10; border: none;
            padding: 0.85rem; border-radius: 100px; font-size: 1rem; font-weight: 700;
            cursor: pointer; margin-top: 0.5rem; transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0,212,170,0.4); }
        .auth-error {
            background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.3);
            color: #ff8585; font-size: 0.85rem; border-radius: 10px;
            padding: 0.7rem 0.9rem; margin-bottom: 1.3rem;
        }
        .auth-switch { text-align: center; color: var(--muted); font-size: 0.88rem; margin-top: 1.6rem; }
        .auth-switch a { color: var(--teal); text-decoration: none; font-weight: 600; }
        .auth-switch a:hover { text-decoration: underline; }
        .auth-home { display: block; text-align: center; margin-top: 1.4rem; color: var(--muted); font-size: 0.8rem; text-decoration: none; }
        .auth-home:hover { color: var(--text); }
    </style>
</head>
<body>
    <div class="glow-orb"></div>
    <div class="auth-card">
        <a href="/" class="auth-logo">Tarra</a>
        <p class="auth-sub">Create an account to save your analyses and track progress.</p>

        {% if error %}
            <div class="auth-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/signup">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" value="{{ username or '' }}"
                       autocomplete="username" autofocus required>
                <span class="field-hint">At least 3 characters.</span>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       autocomplete="new-password" required>
                <span class="field-hint">At least 6 characters.</span>
            </div>
            <button type="submit" class="btn-submit">Create account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
        <a href="/" class="auth-home">← Back to home</a>
    </div>
</body>
</html>
